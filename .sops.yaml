keys:
  - &gurinderu age136r67xtts44mvg8a84mkeq4pfsv47gs5jkm7xddwnzwkfq3wwvnqrmj9s6
  - &thinkpad-x1-gen12 age1mzmfv3k2rw5ut0zn76y46wh7cl7x4ac6zh9mq08fpxxu23mqqdysnvwv3q

# One file per recipient set, so each host's key decrypts only what that host
# reads (layout: README "Secrets", secrets/default.nix). gurinderu is the Mac's
# key and the admin key, so it is a recipient everywhere.
creation_rules:
  # sing-box VLESS credentials: read by both hosts.
  - path_regex: (^|/)secrets/shared\.yaml$
    key_groups:
      - age:
          - *gurinderu
          - *thinkpad-x1-gen12
  # Thinkpad-only (CI runner, Docker Hub).
  - path_regex: (^|/)secrets/thinkpad\.yaml$
    key_groups:
      - age:
          - *gurinderu
          - *thinkpad-x1-gen12
  # Mac-only (SSH keys): the thinkpad key is deliberately not a recipient.
  - path_regex: (^|/)secrets/mac\.yaml$
    key_groups:
      - age:
          - *gurinderu
